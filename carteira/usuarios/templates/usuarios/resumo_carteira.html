{% extends "base.html" %}

{% block title %}Resumo da Carteira{% endblock %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-4">Relatório da Carteira</h2>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title">Análise Geral</h5>
            <p class="card-text">{{ relatorio|linebreaks }}</p>  <!-- Mantém quebras de linha -->
        </div>
    </div>

    <a href="{% url 'dashboard' %}" class="btn btn-primary mt-4">Voltar ao Dashboard</a>
</div>
{% endblock %}
